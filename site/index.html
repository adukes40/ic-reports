<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IC Reports</title>
<meta name="description" content="Ready-to-run Infinite Campus SQL: validation checks, lists, KPIs and vendor pulls. Copy a query and paste it into Data Extract.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@400&display=swap">
<style>
/* Caesar Rodney School District look: Rider Blue and Gold, Playfair Display headings, square corners.
   Layout: a front door (search + category cards), then one column per category with queries that open in place. */
:root {
  --blue: #000098;        /* crsd-blue */
  --gold: #fcbe14;        /* crsd-gold: rules, fills; never text on white */
  --ink: #000000;
  --paper: #ffffff;
  --muted: #444444;
  --line: #d4d4d4;
  --line-2: #b8b8b8;
  --soft: #f2f2f2;
  --open: #fff7dc;
  --good: #1e6b34; --good-bg: #e3f1e6;
  --review: #6e4a00; --review-bg: #fdf0c8; --review-bar: #d99a00;
  --notrun: #444444; --notrun-bg: #ececec;
  --broken: #a1201b; --broken-bg: #fbe3e1;
  --font-ui: Carlito, Calibri, "Segoe UI", Arial, sans-serif;
  --font-head: "Playfair Display", "Times New Roman", Times, serif;
  --font-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  --gutter: clamp(16px, 3.3vw, 48px);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--font-ui); }
a { color: var(--blue); }
a:hover { color: var(--ink); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* header */
.top { background: var(--blue); color: #fff; border-bottom: 4px solid var(--gold); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-block: 16px; }
.brand { margin-right: auto; border: 0; background: none; padding: 0; color: #fff; font: 400 30px/1.1 var(--font-head); cursor: pointer; text-align: left; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 4px; font-weight: 700; text-decoration: none; cursor: pointer; border: 2px solid transparent; white-space: nowrap; }
.btn-ghost { border-color: #fff; color: #fff; background: transparent; }
.btn-ghost:hover { color: var(--blue); background: #fff; }
.btn-gold { background: var(--gold); color: var(--blue); }
.btn-gold:hover { color: var(--blue); filter: brightness(1.05); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { color: #fff; filter: brightness(1.3); }
.btn-line { border-color: var(--blue); color: var(--blue); background: #fff; }
.btn-line:hover { background: var(--blue); color: #fff; }
.btn-sm { min-height: 40px; padding: 0 16px; }

main .wrap { padding-block: 40px 64px; display: flex; flex-direction: column; gap: 32px; }
h1 { margin: 0; font: 400 clamp(32px, 4vw, 44px)/1.1 var(--font-head); color: var(--blue); text-wrap: balance; }
.lede { margin: 0; font-size: 19px; max-width: 65ch; }
.muted { color: var(--muted); }

/* search */
.search label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.search input { width: 100%; min-height: 52px; padding: 0 16px; border: 2px solid var(--blue); border-radius: 4px; font-size: 18px; background: #fff; }
.search input.small { min-height: 44px; font-size: 16px; border-width: 1px; border-color: #8a8a8a; }

/* category cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.card { display: flex; flex-direction: column; gap: 14px; padding: 24px; border: 1px solid var(--line-2); border-top: 6px solid var(--blue); background: #fff; text-align: left; cursor: pointer; color: var(--ink); text-decoration: none; }
.card:hover { border-color: var(--blue); color: var(--ink); }
.card h2 { margin: 0; font: 400 24px/1.2 var(--font-head); color: var(--blue); }
.card p { margin: 0; color: #333; flex-grow: 1; }
.bar { display: flex; height: 10px; background: var(--notrun-bg); }
.bar span { height: 100%; }
.card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.legend { margin: 0; font-size: 14px; color: var(--muted); }

/* status */
.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 2px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.s-good { color: var(--good); background: var(--good-bg); }
.s-review { color: var(--review); background: var(--review-bg); }
.s-notrun { color: var(--notrun); background: var(--notrun-bg); }
.s-broken { color: var(--broken); background: var(--broken-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: 2px solid var(--blue); border-radius: 4px; background: #fff; color: var(--blue); font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--blue); color: #fff; }

/* sections + rows */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 15px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
.cat-head > div { flex: 1 1 420px; display: flex; flex-direction: column; gap: 8px; }
.section { display: flex; flex-direction: column; }
.section h2 { margin: 0; padding-bottom: 10px; border-bottom: 3px solid var(--blue); font: 400 26px/1.2 var(--font-head); color: var(--blue); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.section h2 small { font: 15px var(--font-ui); color: var(--ink); margin-left: auto; }
.section h3 { margin: 20px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); font-size: 17px; }
.item { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 16px 8px 16px 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.row:hover { background: #fafafa; }
.item.open > .row { background: var(--open); }
.row .num { font: 13px var(--font-mono); color: var(--muted); padding-left: 8px; }
.row .nm { font-weight: 700; font-size: 17px; color: var(--blue); }
.row .pp { display: block; font-size: 15px; color: #333; }
.detail { padding: 4px 0 28px 60px; display: flex; flex-direction: column; gap: 16px; }
.facts { margin: 0; display: grid; grid-template-columns: minmax(100px, max-content) minmax(0, 1fr); border-top: 2px solid var(--gold); }
.facts dt { padding: 10px 14px 10px 0; border-bottom: 1px solid #e2e2e2; font-weight: 700; }
.facts dd { margin: 0; padding: 10px 0; border-bottom: 1px solid #e2e2e2; overflow-wrap: anywhere; }
.facts code { font: 14px var(--font-mono); }
.check { background: var(--review-bg); padding: 12px 16px; }
.check strong { color: var(--blue); }
.code { border: 1px solid var(--line-2); }
.code-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px 8px 16px; background: var(--soft); border-bottom: 1px solid var(--line-2); }
.code-bar .file { font: 13px var(--font-mono); color: var(--muted); margin-right: auto; overflow-wrap: anywhere; min-width: 0; }
.copied { font-size: 14px; font-weight: 700; color: var(--good); }
.code-body { overflow: auto; max-height: 460px; padding: 12px 0; font: 13px/21px var(--font-mono); }
.ln { display: flex; }
.ln b { flex: none; width: 48px; padding-right: 14px; text-align: right; color: #6b6b6b; font-weight: 400; user-select: none; }
.ln span.t { white-space: pre; padding-right: 16px; }
.k { color: var(--blue); font-weight: 600; } .s { color: #8a3b00; } .c { color: #5f5f5f; font-style: italic; } .d { color: var(--good); } .v, .f { color: #6b2c8f; }
.empty { padding: 16px 0; color: var(--muted); margin: 0; }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 20px 32px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; }

@media (max-width: 640px) {
  .detail { padding-left: 0; }
  .row { grid-template-columns: 44px minmax(0, 1fr); }
  .row .pill { grid-column: 2; justify-self: start; }
  .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="home" type="button">IC Reports</button>
  <a class="btn btn-ghost" href="ic-reports-all.zip" download>Download all</a>
  <a class="btn btn-gold" id="reqBtn" href="#" target="_blank" rel="noopener">Request a query</a>
</div></header>

<main><div class="wrap" id="app"><p class="muted">Loading queries…</p></div></main>

<footer><div class="wrap">
  <span>Paste any query into Infinite Campus's data extract tool. Change values in its PARAMETERS block to run one school or a different date.</span>
  <a href="https://github.com/adukes40/ic-reports">Source on GitHub</a>
</div></footer>

<script>
// Set this to your Google Form link.
const REQUEST_URL = "";

const STATUS = { "Confirmed good": "good", "Needs review": "review", "Not run yet": "notrun", "Broken": "broken" };
const STATUSES = ["Confirmed good", "Needs review", "Not run yet", "Broken"];
const BAR = { good: "var(--good)", review: "var(--review-bar)", broken: "var(--broken)" };
const KW = new Set("select from where join left right inner outer cross apply on and or not in is null as with case when then else end order by group having distinct top declare int date varchar union all exists over partition desc asc between like set into values collate".split(" "));
const FN = new Set("row_number count sum max min convert cast isnull coalesce nullif ltrim rtrim datediff dateadd getdate string_agg patindex len upper lower replace".split(" "));

let DATA = [], CATS = [];
const st = { view: "home", cat: null, open: null, q: "", catQ: "", status: "all" };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = s => `<span class="pill s-${STATUS[s] || "notrun"}">${esc(s)}</span>`;
const words = q => q.toLowerCase().split(/\s+/).filter(Boolean);
const hits = (d, q) => { const w = words(q); if (!w.length) return true; const h = [d.num, d.name, d.group, d.purpose, d.tables, d.output, Object.values(d.extra || {}).join(" "), d.sql].join(" ").toLowerCase(); return w.every(x => h.includes(x)); };

function hl(sql) {
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|(@\w+)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]+\b)/g;
  const wrap = (cls, t) => t.split("\n").map(p => `<span class="${cls}">${esc(p)}</span>`).join("\n");
  let out = "", last = 0, m;
  while ((m = re.exec(sql))) {
    out += esc(sql.slice(last, m.index));
    const t = m[0], l = t.toLowerCase();
    out += m[1] ? wrap("c", t) : m[2] ? wrap("s", t) : m[3] ? `<span class="v">${t}</span>` : m[4] ? `<span class="d">${t}</span>`
         : KW.has(l) ? `<span class="k">${t}</span>` : FN.has(l) ? `<span class="f">${t}</span>` : t;
    last = re.lastIndex;
  }
  return out + esc(sql.slice(last));
}

function itemHTML(d) {
  const open = st.open === d.id;
  let html = `<div class="item${open ? " open" : ""}" id="q-${d.id}">
    <button class="row" type="button" data-open="${d.id}" aria-expanded="${open}">
      <span class="num">#${d.num}</span>
      <span><span class="nm">${esc(d.name)}</span><span class="pp">${esc(d.purpose)}</span></span>
      ${pill(d.status)}
    </button>`;
  if (open) {
    const facts = [["Type", d.type], ["Output", d.output], ["Parameters", d.params && `<code>${esc(d.params)}</code>`, true], ["Tables", d.tables],
      ...Object.entries(d.extra || {})].filter(f => f[1]);
    const lines = hl(d.sql.replace(/\n+$/, "")).split("\n");
    html += `<div class="detail">
      <dl class="facts">${facts.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join("")}</dl>
      ${d.check ? `<div class="check"><strong>Check before running: </strong>${esc(d.check)}</div>` : ""}
      <div class="code">
        <div class="code-bar"><span class="file">${esc(d.file)}</span><span class="copied" role="status"></span>
          <a class="btn btn-line btn-sm" href="${esc(d.file)}" download>Download .sql</a>
          <button class="btn btn-blue btn-sm" type="button" data-copy="${d.id}">Copy SQL</button></div>
        <div class="code-body">${lines.map((l, i) => `<div class="ln"><b>${i + 1}</b><span class="t">${l || " "}</span></div>`).join("")}</div>
      </div>
    </div>`;
  }
  return html + `</div>`;
}

function listHTML(items) {
  let html = "", group = null;
  for (const d of items) {
    if (d.group && d.group !== group) { html += `<h3>${esc(d.group)}</h3>`; group = d.group; }
    html += itemHTML(d);
  }
  return html;
}

function homeView() {
  const results = st.q ? DATA.filter(d => hits(d, st.q)) : [];
  const cards = CATS.map(c => {
    const qs = DATA.filter(d => d.cat === c.key), n = qs.length;
    const cnt = s => qs.filter(d => d.status === s).length;
    const seg = (s, k) => n ? `<span style="width:${100 * cnt(s) / n}%;background:${BAR[k]}"></span>` : "";
    return `<a class="card" href="#${c.key}">
      <h2>${esc(c.label)}</h2><p>${esc(c.blurb)}</p>
      <span class="bar" aria-hidden="true">${seg("Confirmed good", "good")}${seg("Needs review", "review")}${seg("Broken", "broken")}</span>
      <span class="foot"><strong>${n} ${n === 1 ? "query" : "queries"}</strong><span>${n ? cnt("Confirmed good") + " confirmed good" : "None yet"}</span></span>
    </a>`;
  }).join("");
  let res = "";
  if (st.q) {
    res = `<p class="muted" role="status" style="margin:0">${results.length} ${results.length === 1 ? "query matches" : "queries match"} “${esc(st.q)}”</p>`;
    for (const c of CATS) {
      const inCat = results.filter(d => d.cat === c.key);
      if (inCat.length) res += `<section class="section"><h2>${esc(c.label)} <small>${inCat.length} found</small></h2>${listHTML(inCat)}</section>`;
    }
  }
  return `
    <div style="display:flex;flex-direction:column;gap:12px;max-width:760px">
      <h1>What do you need to check?</h1>
      <p class="lede">Pick a category, or search every query by name, table or column.</p>
    </div>
    <div class="search"><label for="q">Search all queries</label>
      <input id="q" type="search" placeholder="Try guardian, RelatedPair or immunization" value="${esc(st.q)}" autocomplete="off"></div>
    ${res}
    <div class="cards">${cards}</div>
    <p class="legend">Each bar shows confirmed good (green), needs review (amber) and broken (red). Gray is not run yet.</p>`;
}

function catView() {
  const c = CATS.find(x => x.key === st.cat);
  if (!c) { st.view = "home"; return homeView(); }
  const all = DATA.filter(d => d.cat === c.key);
  const shown = all.filter(d => (st.status === "all" || d.status === st.status) && hits(d, st.catQ));
  const chips = ["all", ...STATUSES].map(s => {
    const n = all.filter(d => (s === "all" || d.status === s) && hits(d, st.catQ)).length;
    return `<button class="chip" type="button" data-status="${s}" aria-pressed="${st.status === s}">${s === "all" ? "All" : s} · ${n}</button>`;
  }).join("");
  return `
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#">All categories</a><span aria-hidden="true">/</span><span>${esc(c.label)}</span></nav>
    <div class="cat-head">
      <div><h1>${esc(c.label)}</h1><p class="lede">${esc(c.blurb)}</p></div>
      ${all.length ? `<a class="btn btn-line" href="${c.key}.zip" download>Download this category</a>` : ""}
    </div>
    <div class="search"><label for="cq">Search in ${esc(c.label)}</label>
      <input id="cq" class="small" type="search" placeholder="Name, table or column" value="${esc(st.catQ)}" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="Filter by status">${chips}</div>
    <section class="section">
      <h2>Queries <small>${shown.length === all.length ? all.length + " queries" : shown.length + " of " + all.length + " shown"}</small></h2>
      ${shown.length ? listHTML(shown) : `<p class="empty">${all.length ? "Nothing matches. Clear the search or pick another status." : "No queries here yet."}</p>`}
    </section>`;
}

function render(focusId) {
  app.innerHTML = st.view === "cat" ? catView() : homeView();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const q = DATA.find(d => "q-" + d.id === h);
  if (q) { st.view = "cat"; st.cat = q.cat; st.open = q.id; st.status = "all"; st.catQ = ""; }
  else if (CATS.some(c => c.key === h)) { if (st.cat !== h) { st.status = "all"; st.catQ = ""; st.open = null; } st.view = "cat"; st.cat = h; }
  else { st.view = "home"; }
  render();
  if (q) { const el = document.getElementById("q-" + q.id); if (el) el.scrollIntoView({ block: "start" }); } else window.scrollTo(0, 0);
}

app.addEventListener("input", e => {
  if (e.target.id === "q") { st.q = e.target.value; render("q"); }
  if (e.target.id === "cq") { st.catQ = e.target.value; render("cq"); }
});
app.addEventListener("click", e => {
  const openBtn = e.target.closest("[data-open]");
  if (openBtn) {
    const id = openBtn.dataset.open; st.open = st.open === id ? null : id;
    if (st.view === "cat" && st.open) history.replaceState(null, "", "#q-" + id);
    render(); const el = document.getElementById("q-" + id); if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: "start" });
    return;
  }
  const chip = e.target.closest("[data-status]");
  if (chip) { st.status = chip.dataset.status; render(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    const d = DATA.find(x => x.id === copy.dataset.copy), msg = copy.parentElement.querySelector(".copied");
    navigator.clipboard.writeText(d.sql).then(() => { msg.textContent = "Copied"; setTimeout(() => msg.textContent = "", 2000); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(copy.closest(".code").querySelector(".code-body")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Selected. Press Ctrl+C"; });
  }
});
document.getElementById("home").addEventListener("click", () => { st.q = ""; location.hash = ""; route(); });
window.addEventListener("hashchange", route);
const req = document.getElementById("reqBtn");
if (REQUEST_URL) req.href = REQUEST_URL;
else { req.removeAttribute("target"); req.addEventListener("click", e => { e.preventDefault(); alert("The request form isn't set up yet. Add your Google Form link to REQUEST_URL in site/index.html."); }); }

fetch("queries.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => { DATA = j.queries; CATS = j.categories; route(); })
  .catch(() => { app.innerHTML = `<p class="empty">Couldn't load the query list. Refresh the page. If it keeps happening, the site build may have failed on GitHub.</p>`; });
</script>
</body>
</html>
